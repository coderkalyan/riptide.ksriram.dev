<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#141517;color:#EDEBE4;
       font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden;position:relative}
  svg.bg{position:absolute;inset:0;width:1200px;height:630px;opacity:.5}
  .inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
  .brand{display:flex;align-items:center;gap:20px;margin-bottom:38px}
  .brand .name{font-size:44px;font-weight:600;letter-spacing:-.5px}
  h1{font-size:74px;line-height:1.04;letter-spacing:-2px;font-weight:600;max-width:17ch}
  h1 .em{color:#a6d189}
  p{margin-top:30px;font-size:26px;line-height:1.45;color:#c4c3bb;max-width:34ch}
  .foot{position:absolute;left:96px;bottom:54px;font-family:'JetBrains Mono',monospace;
        font-size:19px;color:#a6d189;letter-spacing:.4px}
</style></head><body>
<svg class="bg" viewBox="0 0 1200 630" preserveAspectRatio="none">
  <g stroke="#72F5DF" stroke-width="1.6" fill="none" opacity=".16">
    <path d="M-20 92 H110 V50 H240 V92 H370 V50 H500 V92 H630 V50 H760 V92 H890 V50 H1020 V92 H1220"/></g>
  <g stroke="#B48CFF" stroke-width="1.6" fill="none" opacity=".13">
    <path d="M-20 560 H160 V520 H330 V560 H540 V520 H780 V560 H1010 V520 H1220"/></g>
</svg>
<div class="inner">
  <div class="brand">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#a6d189" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M2 14 L6 14 L6 7 L11 7 L11 17 L16 17 L16 11 L22 11"/></svg>
    <span class="name">Riptide</span>
  </div>
  <h1>Debug your RTL <span class="em">without the headache</span>.</h1>
  <p>A GPU-accelerated waveform debugger for traces that are too big for the tools you're used to.</p>
</div>
<div class="foot">riptide.ksriram.dev</div>
</body></html>
